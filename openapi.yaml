openapi: 3.0.3
info:
  title: Projeto do SENAI Jandira - Professor Marcel
  description: |-
   API destinada a controle de uma locadora de filmes
  termsOfService: http://swagger.io/terms/
  contact:
    email: nathansilvacosta2303@email.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080
paths:
  /v1/locadora/filme:
    get:
      tags:
        - filme
      summary: Busca todos os filmes
      description: Retorna uma lista de filmes
      responses:
        '200':
          description: Requisição bem sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filme'
        '404':
          description: Não foram encontrados dados de retorno
        '500':
          description: Não foi possível processar a requisição devido a erros internos no servidor (CONTROLLER ou MODELAGEM DE DADOS)
    post:
      tags:
        - filme
      summary: Cria um filme
      description: Cria um novo filme
      requestBody:
        description: Cria um novo filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '201':
          description: Item criado com sucesso
        '400':
          description: Não foi possível processar a requisição pois existem campos obrigatórios que devem ser encaminhados e antedidos conforme documentação
        '415':
          description: Não foi possível processar a requisição, pois o tipo de dados enviado no corpo deve ser JSON
        '500':
          description: Não foi possível processar a requisição devido a erros internos no servidor (CONTROLLER ou MODELAGEM DE DADOS)
  /v1/locadora/filme/{id}:
    get:
      tags:
        - filme
      summary: Busca um filme pelo ID
      description: Retorna um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID do filme de retorno
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Requisição bem sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filme'          
        '400':
          description: (referente a validação do ID) - Não foi possível processar a requisição pois existem campos obrigatórios que devem ser encaminhados e antedidos conforme documentação
        '404':
          description: Não foram encontrados dados de retorno
        '500':
          description: Não foi possível processar a requisição devido a erros internos no servidor (CONTROLLER ou MODELAGEM DE DADOS)
    put:
      tags:
        - filme
      summary: Atualiza um filme existente
      description: Atualiza um filme existente pelo ID
      parameters:
        - name: id
          in: path
          description: ID do filme de retorno
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Atualiza um filme existente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Filme'
        required: true
      responses:
        '200':
          description: Item atualizado com sucesso
        '400':
          description: (referente a validação do ID) - Não foi possível processar a requisição pois existem campos obrigatórios que devem ser encaminhados e antedidos conforme documentação
        '404':
          description: Não foram encontrados dados de retorno
        '415':
          description: Não foi possível processar a requisição, pois o tipo de dados enviado no corpo deve ser JSON
        '500':
          description: Não foi possível processar a requisição devido a erros internos no servidor (CONTROLLER ou MODELAGEM DE DADOS)
    delete:
      tags:
        - filme
      summary: Apaga um filme
      description: Excluir um filme
      parameters:
        - name: id
